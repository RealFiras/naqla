name: Deploy preview

on:
  push:
    branches: [main]
    paths:
      - preview/**
      - docs/**
      - scripts/prepare-pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
      - id: deployment
        uses: actions/deploy-pages@v4
